name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # bunfig.toml enforces a 24h minimum release age for new packages.
      # On a clean CI machine that check can reject freshly published locked
      # versions and fail the install, so relax it for CI only (the repo's
      # bunfig.toml is left unchanged).
      - name: Relax supply-chain guard for CI install
        run: sed -i 's/minimumReleaseAge = 86400/minimumReleaseAge = 0/' bunfig.toml

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site
        run: bun run build

      # The static output lands in dist/client locally and .output/public on
      # some builds, so detect whichever exists.
      - name: Locate static output
        id: out
        run: |
          if [ -d dist/client ]; then DIR=dist/client;
          elif [ -d .output/public ]; then DIR=.output/public;
          else echo "No static output found"; ls -la; exit 1; fi
          touch "$DIR/.nojekyll"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.out.outputs.dir }}


  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
