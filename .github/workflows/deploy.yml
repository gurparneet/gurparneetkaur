name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # bunfig.toml enforces a 24h minimum release age for new packages.
      # On a clean CI machine that check can reject freshly published locked
      # versions and fail the install, so relax it for CI only (the repo's
      # bunfig.toml is left unchanged).
      - name: Relax supply-chain guard for CI install
        run: sed -i 's/minimumReleaseAge = 86400/minimumReleaseAge = 0/' bunfig.toml

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site
        run: bun run build

      - name: Disable Jekyll processing
        run: touch dist/client/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
